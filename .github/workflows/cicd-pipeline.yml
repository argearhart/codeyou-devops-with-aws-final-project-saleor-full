name: Saleor CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - staging
      - production

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      BRANCH_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry ruff pip-audit

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Linter
        run: |
          ruff check . || true

      - name: Dependency Analysis
        run: |
          pip-audit  || true

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "BRANCH_TAG=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build API Docker Image
        run: |
          docker build -t argearhart/saleor-api:${{ env.IMAGE_TAG }} ./saleor-api
          docker tag argearhart/saleor-api:${{ env.IMAGE_TAG }} argearhart/saleor-api:production
          docker tag argearhart/saleor-api:${{ env.IMAGE_TAG }} argearhart/saleor-api:latest

      - name: Build Dashboard Docker Image
        run: |
          docker build -t argearhart/saleor-dashboard:${{ env.IMAGE_TAG }} ./saleor-dashboard
          docker tag argearhart/saleor-dashboard:${{ env.IMAGE_TAG }} argearhart/saleor-dashboard:production
          docker tag argearhart/saleor-dashboard:${{ env.IMAGE_TAG }} argearhart/saleor-dashboard:latest

      - name: Trivy Security Scan for API
        run: |
          trivy image argearhart/saleor-api:${{ env.IMAGE_TAG }} || true

      - name: Trivy Security Scan for Dashboard
        run: |
          trivy image argearhart/saleor-dashboard:${{ env.IMAGE_TAG }}  || true

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push API Image to DockerHub
        if: github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'production'
        run: |
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          for tag in $IMAGE_TAG production latest; do
            docker tag argearhart/saleor-api:$IMAGE_TAG argearhart/saleor-api:$tag
            docker push argearhart/saleor-api:$tag
          done

      - name: Push Dashboard Image to DockerHub
        if: github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'production'
        run: |
          for tag in ${{ env.IMAGE_TAG }} production latest; do
            docker tag argearhart/saleor-dashboard:${{ env.IMAGE_TAG }} argearhart/saleor-dashboard:$tag
            docker push argearhart/saleor-dashboard:$tag
          done

  staging-validation:
    needs: build
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Validate Docker Compose
        run: |
          set -e
          docker compose up -d 
          sleep 10  
          docker compose ps

      - name: Stop Containers
        run: docker compose down -v

  production-deploy:
    needs: staging-validation
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: AWS Task Definition
        run: |
          TASK_DEFINITION=$(aws ecs describe-task-definition --task-definition Saleor-task-Amanda-Gearhart)

          NEW_TASK_DEF=$(echo "$TASK_DEFINITION" | jq --arg IMAGE_API "argearhart/saleor-api:latest" \
          --arg IMAGE_DASHBOARD "argearhart/saleor-dashboard:latest" \
          '.taskDefinition | {family, containerDefinitions: (.containerDefinitions | map(if .name == "saleor-api" then .image=$IMAGE_API elif .name == "saleor-dashboard" then 
          .image=$IMAGE_DASHBOARD | .memory=512  else . end))}')

          echo "$NEW_TASK_DEF" > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json

      - name: Update ECS Service
        run: |
          echo "Updating AWS ECS Service..."
          aws ecs update-service --cluster Saleor-Cluster-Amanda-Gearhart --service Saleor-tasks-gearhart-2 --force-new-deployment
          echo "AWS ECS deployment completed!"
