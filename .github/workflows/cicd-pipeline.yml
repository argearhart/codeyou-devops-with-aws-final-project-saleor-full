name: Saleor CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - staging
      - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry ruff pip-audit

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Linter
        run: |
          ruff check . || true

      - name: Dependency Analysis
        run: |
          pip-audit  || true

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "BRANCH_TAG=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build API Docker Image
        run: |
          docker build -t argearhart/saleor-api:${{ env.IMAGE_TAG }} ./saleor-api
          docker tag argearhart/saleor-api:${{ env.IMAGE_TAG }} argearhart/saleor-api:production
          docker tag argearhart/saleor-api:${{ env.IMAGE_TAG }} argearhart/saleor-api:latest

      - name: Build Dashboard Docker Image
        run: |
          docker build -t argearhart/saleor-dashboard:${{ env.IMAGE_TAG }} ./saleor-dashboard
          docker tag argearhart/saleor-dashboard:${{ env.IMAGE_TAG }} argearhart/saleor-dashboard:production
          docker tag argearhart/saleor-dashboard:${{ env.IMAGE_TAG }} argearhart/saleor-dashboard:latest

      - name: Trivy Security Scan for API
        run: |
          trivy image argearhart/saleor-api:${{ github.ref_name }} || true

      - name: Trivy Security Scan for Dashboard
        run: |
          trivy image argearhart/saleor-dashboard:${{ github.ref_name }}  || true

      - name: Push API Image to DockerHub
        if: github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'production'
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push argearhart/saleor-api:${{ env.IMAGE_TAG }}
          docker push argearhart/saleor-api:production
          docker push argearhart/saleor-api:latest

      - name: Push Dashboard Image to DockerHub
        if: github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'production'
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push argearhart/saleor-dashboard:${{ env.IMAGE_TAG }}
          docker push argearhart/saleor-dashboard:production
          docker push argearhart/saleor-dashboard:latest

  staging-validation:
    needs: build
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Validate Docker Compose
        run: |
          docker-compose up -d || true
          sleep 10  
          docker-compose ps || true

      - name: Stop Containers
        run: docker-compose down -v || true

  production-deploy:
    needs: [build, staging-validation]
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to AWS ECS
        run: |
          echo "Updating AWS ECS Task Definition..."
          aws ecs update-service --cluster saleor-cluster --service saleor-service --force-new-deployment
          echo "AWS ECS deployment completed!"
